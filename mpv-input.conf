# Keep native playback controls; add visible feedback for these four keys.
9 osd-msg-bar add volume -5
0 osd-msg-bar add volume 5
m cycle mute; show-text "${?mute==yes:已靜音}${?mute==no:已取消靜音} | 音量 ${volume}%" 2000
SPACE cycle pause; show-text "${?pause==yes:已暫停}${?pause==no:繼續播放}" 2000

# Boss key: drop the picture at once, audio keeps running, nothing is printed.
b cycle video
# Same plus pause and mute, for when someone is actually standing there.
B cycle video ; set pause yes ; set mute yes
